<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Poliglota | Practice</title>

    <link rel="stylesheet" href="css/practice.css">

</head>

<body>

    <div class="practice-container">

        <!-- HEADER -->

        <header class="practice-header">

            <div>

                <span class="brand">
                    ACADEMIA POLIGLOTA
                </span>

                <h1>Practice Zone</h1>

                <p id="practice-description">
                    Improve your English through interactive exercises.
                </p>

            </div>

            <div class="page-information">

                <span id="unit-label">UNIT 01</span>

                <strong id="page-label">PAGE 06</strong>

            </div>

        </header>


        <!-- PROGRESS -->

        <div class="progress-section">

            <div class="progress-information">

                <span id="exercise-counter">
                    Exercise 1
                </span>

                <span id="exercise-progress">
                    0%
                </span>

            </div>

            <div class="progress-track">

                <div id="progress-bar"></div>

            </div>

        </div>


        <!-- EXERCISE AREA -->

        <main id="exercise-container">

            <div class="loading-message">

                Loading practice activities...

            </div>

        </main>


        <!-- NAVIGATION -->

        <footer class="practice-navigation">

            <button id="previous-exercise">
                ← Previous
            </button>

            <button id="check-answer">
                Check Answer
            </button>

            <button id="next-exercise">
                Next Exercise →
            </button>

        </footer>

    </div>


    <script src="js/practice-data.js"></script>

    <script src="js/practice.js"></script>

</body>

</html>
